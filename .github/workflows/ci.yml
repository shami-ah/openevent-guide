name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # extension/sdk.js is a committed build artifact. If it has drifted from
      # the sources, the extension injects a stale SDK and the bug is invisible
      # until someone reloads it by hand.
      - run: npm run check:bundle
